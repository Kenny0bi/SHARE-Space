<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Letters from Allies | SHARE Space</title>

  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/tabs.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/allies.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <a href="https://www.bmc.org/pediatrics-autism-program" target="_blank">
        <img src="images/autismlogo.png" alt="Autism Logo" class="header-logo" />
      </a>
    </div>

    <div class="header-middle">
      <div class="header-center">
        <h1 class="share-title">SHARE Space</h1>
        <p class="share-subtitle">
          (Stories, Hope, and Real Experiences from the Autism Community at Boston Medical Center)
        </p>
      </div>
    </div>

    <div class="floating-left">
      <img src="images/himg1.png" alt="Floating Star" class="floating-icon" />
    </div>

    <div class="floating-right">
      <img src="images/himg3.png" alt="Floating Puzzle" class="floating-icon" />
    </div>
  </header>

  <!-- TABS -->
  <div class="tabs-header">
    <div class="nav-tabs">
      <button class="tab-button" onclick="location.href='index.html'">Welcome</button>
      <button class="tab-button active" onclick="location.href='read.html'">Read a Letter</button>
      <button class="tab-button" onclick="location.href='submit.html'">Submit a Letter</button>
    </div>
    <div class="admin-tab">
      <button class="tab-button" onclick="location.href='login.html'">Admin Login</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="parents-main">
    <h2 class="parents-heading">Letters from Allies</h2>

    <div class="letter-grid" id="firebaseLetterContainer">
      
    </div>
  </main>

  <!-- MODAL for Letters -->
  <div id="letterModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="letter-modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 class="modal-title" id="modalTitle">Letter Title</h2>
      <div class="modal-body" id="modalLetter">Letter content will appear here.</div>
      <div class="modal-meta" id="modalMeta">From: Name • Date</div>
      <button id="readAloudBtn" class="read-aloud-btn" onclick="readLetterAloud()">🔊 Read Aloud</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <a href="https://www.bmc.org/pediatrics-autism-program" target="_blank">
      <img src="images/autismlogo.png" alt="Boston Medical Logo" class="footer-logo" />
    </a>
  </footer>

  <!-- FIREBASE + MODAL + READ ALOUD Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiGubyr9VF9dZlx37uN_-4r_yhOx_twYE",
      authDomain: "share-space-c22c9.firebaseapp.com",
      databaseURL: "https://share-space-c22c9-default-rtdb.firebaseio.com/",
      projectId: "share-space-c22c9",
      storageBucket: "share-space-c22c9.appspot.com",
      messagingSenderId: "592722668334",
      appId: "1:592722668334:web:9acbd3378349cd79fce8bf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const letterContainer = document.querySelector('.letter-grid');
    const lettersRef = ref(db, "letters/strangers");  

    onValue(lettersRef, (snapshot) => {
  letterContainer.innerHTML = '';

  const allLetters = [];

  snapshot.forEach(letterSnap => {
    const letter = letterSnap.val();
    if (letter.approved) {
      allLetters.push({
        ...letter,
        timestamp: letter.timestamp || 0  
      });
    }
  });

  allLetters.sort((a, b) => b.timestamp - a.timestamp);

  allLetters.forEach(letter => {
    const div = document.createElement("div");
    div.className = "envelope-entry";
    div.innerHTML = `
      <img src="images/envelope-icon.png" alt="Envelope" class="envelope-img" />
      <div class="meta-info">
        <div class="sender-name">From: ${letter.name || "Anonymous"}</div>
        <div class="sent-date">${letter.date}</div>
      </div>
    `;
    div.addEventListener("click", () => openLetterModal(letter));
    letterContainer.appendChild(div);
  });
});

    let isReading = false;
    let currentUtterance = null;

    // OPEN MODAL
    window.openLetterModal = function(letter) {
      document.getElementById('modalTitle').textContent = letter.title || "Untitled Letter";
      document.getElementById('modalLetter').textContent = letter.letter || "No content available.";
      document.getElementById('modalMeta').textContent = `From: ${letter.name || "Anonymous"} • ${letter.date}`;

      const modalOverlay = document.getElementById('letterModal');
      const modalBox = modalOverlay.querySelector('.letter-modal');

      modalOverlay.style.display = 'flex';
      modalBox.style.animation = 'none';
      modalBox.offsetHeight;
      modalBox.style.animation = 'popIn 1s ease forwards';
    };

    // CLOSE MODAL
    window.closeModal = function() {
      document.getElementById('letterModal').style.display = 'none';
      speechSynthesis.cancel();
      isReading = false;
    };

    // READ ALOUD BUTTON
    window.readLetterAloud = function() {
      if (speechSynthesis.speaking && !speechSynthesis.paused) {
        speechSynthesis.pause();
        isReading = false;
        return;
      } 
      if (speechSynthesis.paused) {
        speechSynthesis.resume();
        isReading = true;
        return;
      }

      const letterText = document.getElementById('modalLetter').textContent;
      const utterance = new SpeechSynthesisUtterance(letterText);

      const voices = speechSynthesis.getVoices();
      const preferredVoice = voices.find(voice =>
        (voice.name.includes('Google US English Female') || 
         voice.name.includes('Microsoft Zira') ||
         (voice.gender && voice.gender.toLowerCase() === 'female') ||
         voice.name.toLowerCase().includes('female') ||
         voice.name.toLowerCase().includes('zira'))
      );

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      utterance.pitch = 0.7;

      currentUtterance = utterance;
      speechSynthesis.speak(currentUtterance);
      isReading = true;
    };
  </script>

</body>
</html>
